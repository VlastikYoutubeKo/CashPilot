name: Public Repocket Docker archives
on:
  push:
    branches: [images/export-repocket]
permissions:
  contents: write
  packages: read
jobs:
  export:
    if: github.repository == 'VlastikYoutubeKo/CashPilot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [cashpilot, cashpilot-worker]
        arch: [amd64, arm64]
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export the tested image and publish a public download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/vlastikyoutubeko/${{ matrix.image }}:sha-07b28e78484126fdc3f0af8fca5c95a7c8ecc7ec
          ARCH: ${{ matrix.arch }}
          ASSET: ${{ matrix.image }}-repocket-api-key-${{ matrix.arch }}.tar.gz
        run: |
          # The multi-platform build runs independently; wait for its push.
          pulled=0
          for attempt in $(seq 1 90); do
            if docker pull --platform "linux/$ARCH" "$IMAGE"; then pulled=1; break; fi
            sleep 10
          done
          test "$pulled" = 1
          docker image inspect "$IMAGE" --format '{{.Architecture}}' | grep -x "$ARCH"
          docker save "$IMAGE" | gzip > "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release upload repocket-api-key "$ASSET" "$ASSET.sha256" --repo VlastikYoutubeKo/CashPilot --clobber
