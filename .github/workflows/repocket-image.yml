name: Repocket temporary images
on:
  push:
    branches: [images/repocket-api-key]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: node --check app/static/js/app.js && node scripts/repocket_form_check.mjs
      - run: uv run pytest tests/ -q --tb=short
  publish:
    needs: test
    if: github.repository == 'VlastikYoutubeKo/CashPilot'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: cashpilot
            dockerfile: Dockerfile
          - image: cashpilot-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CASHPILOT_VERSION=repocket-api-key-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/VlastikYoutubeKo/CashPilot
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/vlastikyoutubeko/${{ matrix.image }}:repocket-api-key
            ghcr.io/vlastikyoutubeko/${{ matrix.image }}:sha-${{ github.sha }}
      - name: Verify manifests and image contents
        env:
          IMAGE: ghcr.io/vlastikyoutubeko/${{ matrix.image }}:sha-${{ github.sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          if [ '${{ matrix.image }}' = cashpilot ]; then
            docker run --rm --entrypoint python "$IMAGE" -c 'from app import catalog; catalog.load_services(); s=catalog.get_service("repocket"); v=next(v for v in s["docker"]["env"] if v["key"]=="RP_API_KEY"); assert v["pattern"]; assert "not your password" in v["label"]'
          else
            docker run --rm --entrypoint python "$IMAGE" -c 'import app.worker'
          fi
